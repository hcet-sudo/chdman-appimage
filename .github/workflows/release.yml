name: Build and release

on:
  schedule:
    # every Monday 04:00 UTC — picks up new MAME releases automatically
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      mame_tag:
        description: "MAME tag to build (e.g. mame0289). Empty = latest release."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["build/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  chdman:
    # ubuntu-24.04, NOT ubuntu-latest: newer runner images ship the amd64v3
    # archive variant, whose prebuilt static glibc is compiled for x86-64-v3 —
    # linking it would SIGILL these baseline binaries on older CPUs even with
    # the compiler shim in build-chdman.sh. Noble's archive is plain x86-64-v1.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libfontconfig1-dev

      - name: Resolve MAME version
        id: ver
        run: |
          TAG="${{ inputs.mame_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(curl -fsSL https://api.github.com/repos/mamedev/mame/releases/latest | jq -r .tag_name)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # mame0289 -> 0.289 (MAME release tags are always mame0xxx)
          VER="0.${TAG#mame0}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Build static chdman AppImage
        run: bash build/build-chdman.sh "${{ steps.ver.outputs.tag }}"

      - name: Self-test
        run: bash build/self-test-chdman.sh dist/chdman-x86_64.AppImage

      - name: Baseline-ISA gate (x86-64-v1 via qemu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          ./dist/chdman-x86_64.AppImage --appimage-extract >/dev/null
          # The extracted inner binary runs under an emulated baseline v1 CPU:
          # any v2+ instruction (from our code OR prebuilt static glibc) dies
          # with SIGILL and blocks the release.
          EMU_PREFIX="qemu-x86_64-static -cpu qemu64" \
            bash build/self-test-chdman.sh squashfs-root/usr/bin/chdman

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/chdman-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [chdman]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum chdman-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (pkgforge-style versioned tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.chdman.outputs.ver }}
        run: |
          TAG="${VER}@$(date -u +%F)_$(date -u +%s)"
          cat > notes.md <<EOF
          Unofficial, fully static AppImage of **chdman ${VER}** (MAME Compressed
          Hunks of Data manager). No system libraries needed — runs on any
          x86_64 Linux regardless of distribution or glibc age.

          ## Install with am / appman
          \`\`\`
          am -e https://github.com/${{ github.repository }} chdman chdman
          \`\`\`

          ## Or grab directly (stable URL)
          \`\`\`
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/chdman-x86_64.AppImage
          chmod +x chdman-x86_64.AppImage
          \`\`\`

          ## Typical workflow (.bin -> .chd)
          \`\`\`
          ./chdman-x86_64.AppImage createcd -i game.cue -o game.chd
          \`\`\`

          Note: chdman cannot read \`.ecm\` files — decode those first with
          [unecm](https://github.com/${{ github.repository_owner }}/unecm-appimage/releases/latest).

          Built and functionally self-tested in CI on every release
          (bit-perfect CD-image roundtrip). See SHA256SUMS.txt for checksums.
          EOF
          gh release create "$TAG" \
            dist/chdman-x86_64.AppImage \
            dist/SHA256SUMS.txt \
            --title "chdman: ${VER}" \
            --notes-file notes.md \
            --latest
